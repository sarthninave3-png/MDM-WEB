<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical no.6</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            background-color: white;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        input {
            border: 1px solid gray;
            padding: 6px;
            border-radius: 5px;
        }

        h1,
        h3 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="bg-gradient-to-r from-fuchsia-500 via-sky-300 to-teal-600 p-6">

    <div class="text-center">

        <h1 class="text-3xl font-bold text-white">
            Practical no.6
        </h1>

        <h3 class="text-2xl font-semibold text-gray-800 mb-6">
            Marks Calculator
        </h3>

        <table class="mx-auto shadow-lg">

            <tr>
                <th>#</th>
                <th>SUBJECTS</th>
                <th>MARKS</th>
            </tr>

            <tr>
                <td>1</td>
                <td>DMGT</td>
                <td>
                    <input type="number" id="s1" placeholder="Enter Marks">
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>MDM-WD</td>
                <td>
                    <input type="number" id="s2" placeholder="Enter Marks">
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>CAO</td>
                <td>
                    <input type="number" id="s3" placeholder="Enter Marks">
                </td>
            </tr>

            <tr>
                <td>4</td>
                <td>ED</td>
                <td>
                    <input type="number" id="s4" placeholder="Enter Marks">
                </td>
            </tr>

            <tr>
                <td>5</td>
                <td>ES</td>
                <td>
                    <input type="number" id="s5" placeholder="Enter Marks">
                </td>
            </tr>

            <tr>
                <td colspan="3">

                    <button
                        onclick="calc()"
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">

                        CALCULATE

                    </button>

                </td>
            </tr>

        </table>

        <div class="mt-8">

            <h1 class="text-2xl font-bold text-gray-900">
                TOTAL MARKS
            </h1>

            <h1 id="totalMarks" class="text-xl font-semibold text-white">
            </h1>

            <br>

            <h1 class="text-2xl font-bold text-gray-900">
                PERCENTAGE %
            </h1>

            <h1 id="percent" class="text-xl font-semibold text-white">
            </h1>

            <br>

            <h1 class="text-2xl font-bold text-gray-900">
                GRADE
            </h1>

            <h1 id="grade" class="text-xl font-semibold text-white">
            </h1>

        </div>

    </div>

    <script>

        function calc()
        {
            let sub1 = Number(document.getElementById("s1").value);
            let sub2 = Number(document.getElementById("s2").value);
            let sub3 = Number(document.getElementById("s3").value);
            let sub4 = Number(document.getElementById("s4").value);
            let sub5 = Number(document.getElementById("s5").value);

            let GRADE = null;

            let total = sub1 + sub2 + sub3 + sub4 + sub5;

            let per = (total / 500) * 100;

            if (per >= 75)
            {
                GRADE = "A";
            }
            else if (per >= 65 && per <= 74)
            {
                GRADE = "B";
            }

            document.getElementById("percent").innerHTML = per;

            document.getElementById("totalMarks").innerHTML = total;

            document.getElementById("grade").innerHTML = GRADE;
        }

    </script>

</body>

</html>
